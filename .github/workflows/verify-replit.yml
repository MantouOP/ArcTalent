name: Verify Replit runtime
on:
  push:
    branches: [replit-runtime]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: artifacts/arctalent-release-2a5b6cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: artifacts/arctalent-release-2a5b6cf/package-lock.json
      - run: npm ci --no-audit --no-fund --workspaces=false
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify production API
        run: |
          node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port 23585 > /tmp/arctalent.log 2>&1 &
          arc_pid=$!
          trap 'kill "$arc_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:23585/api/health; then break; fi
            sleep 1
          done
          TEST_BASE_URL=http://localhost:23585 npm run test:integration
